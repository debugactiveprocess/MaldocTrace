name: CI

# Runs on every push to main and every pull request: formatting, vet, the
# test suite, a short fuzzing pass over the main parsers, and a check that the
# PyPI wheels can still be built from release-style archives.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$out" ]; then echo "not gofmt-formatted:"; echo "$out"; exit 1; fi

      - run: go vet ./...
      - run: go test ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ".", target: FuzzAnalyzeBytes }
          - { pkg: ".", target: FuzzAnalyzeVBScript }
          - { pkg: ".", target: FuzzOneNote }
          - { pkg: "./extractor", target: FuzzRTF }
          - { pkg: "./extractor", target: FuzzBIFF }
          - { pkg: "./payload", target: FuzzDeobfuscateBatch }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Fuzz ${{ matrix.target }} for 30s
        run: go test -run '^$' -fuzz "^${{ matrix.target }}\$" -fuzztime 30s "${{ matrix.pkg }}"

  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build release-style archives and wheels
        run: |
          VERSION="$(sed -n 's/^var Version = "\(.*\)"/\1/p' analyze.go)"
          mkdir -p dist
          for p in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${p%/*}"; arch="${p#*/}"; name="maldocTrace_${VERSION}_${os}_${arch}"
            bin=maldocTrace; [ "$os" = windows ] && bin=maldocTrace.exe
            mkdir -p "stage/$name"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "stage/$name/$bin" ./cmd/maldoctrace
            if [ "$os" = windows ]; then (cd stage && zip -qr "../dist/$name.zip" "$name"); else tar -C stage -czf "dist/$name.tar.gz" "$name"; fi
          done
          python3 python/build_wheels.py --version "$VERSION" --dist dist --out wheels
      - name: Install the Linux wheel and run it
        run: |
          python3 -m venv venv
          venv/bin/pip install wheels/*manylinux*x86_64*.whl
          venv/bin/maldoctrace version
          venv/bin/python -c "import maldoctrace; print(maldoctrace.__version__, maldoctrace.find_binary())"
